stages:
  - probe
  - build

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"

default:
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq > /dev/null
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openjdk-17-jdk-headless unzip zip curl > /dev/null
    - export ANDROID_HOME="$CI_PROJECT_DIR/android-sdk"
    - curl -sO https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
    - mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
    - unzip -q commandlinetools-linux-11076708_latest.zip -d /tmp/ct && mv /tmp/ct/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
    - rm -f commandlinetools-linux-11076708_latest.zip
    - export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools"
    - (yes | sdkmanager --licenses > /dev/null 2>&1) || true
    - sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
    - (curl -sLO https://mirrors.cloud.tencent.com/gradle/gradle-8.7-bin.zip || curl -sLO https://services.gradle.org/distributions/gradle-8.7-bin.zip) && unzip -tq gradle-8.7-bin.zip > /dev/null
    - unzip -q gradle-8.7-bin.zip -d "$CI_PROJECT_DIR/tools"
    - export PATH="$PATH:$CI_PROJECT_DIR/tools/gradle-8.7/bin"

probe:
  stage: probe
  script:
    - java -version 2>&1 | head -1
    - sdkmanager --version
    - gradle --version 2>&1 | grep -E "Gradle|JVM" || true

# ---------- v1.3.0: 构建前证书红线校验 (SHA-256 必须 e47e48d3, 与 /workspace/.secrets 本地件一致, 不一致 = 停止) ----------
check-cert:
  stage: build
  script:
    - export JAVA_TOOL_OPTIONS="-Xmx1400m -XX:MaxMetaspaceSize=512m"
    - mkdir -p app/keystore
    - echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore && ls -la app/keystore/release.keystore
    - CERT_SHA256="$(keytool -list -v -keystore app/keystore/release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | grep -m1 'SHA256:' | awk '{print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
    - echo "keystore cert SHA-256 = $CERT_SHA256"
    - |
      # dash /bin/sh 的 test 不支持 * 通配, 用 cut 取前 8 位做字面比较 (v1.3.0 fix)
      CERT_PREFIX=$(printf '%s' "$CERT_SHA256" | cut -c1-8)
      echo "cert prefix = $CERT_PREFIX"
      if [ "$CERT_PREFIX" != "e47e48d3" ]; then
        echo "!!! 证书指纹与红线 e47e48d3 不一致, 停止构建 !!!"
        exit 1
      fi
    - echo "cert check OK (前缀 e47e48d3)"

build-release:
  stage: build
  needs: ["probe", "check-cert"]
  script:
    - export JAVA_TOOL_OPTIONS="-Xmx1400m -XX:MaxMetaspaceSize=512m"
    - mkdir -p app/keystore
    - echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore && ls -la app/keystore/release.keystore
    - gradle --no-daemon -Dorg.gradle.jvmargs="-Xmx1400m -XX:MaxMetaspaceSize=512m" :app:signingReport 2>&1 | tail -40
    - gradle --no-daemon -Dorg.gradle.jvmargs="-Xmx1400m -XX:MaxMetaspaceSize=512m" assembleRelease 2>&1 | tail -120
    - ls -la app/build/outputs/apk/release/
    - if [ -f app/build/outputs/apk/release/app-release.apk ]; then cp app/build/outputs/apk/release/app-release.apk xiaoyan-pet-v1.3.0-release.apk; else cp app/build/outputs/apk/release/*.apk xiaoyan-pet-v1.3.0-release.apk; fi
    - ls -la xiaoyan-pet-v1.3.0-release.apk
    # 构建后证书红线复检 (apksigner 为准, keytool -printcert 不可靠)
    - APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"; $APKSIGNER verify --print-certs xiaoyan-pet-v1.3.0-release.apk 2>&1 | head -12 || echo "(apksigner missing)"
    - "POST_SHA=$(APKSIGNER verify --print-certs xiaoyan-pet-v1.3.0-release.apk 2>/dev/null | grep -m1 'SHA-256:' | awk '{print $2}')"
    - echo "apk cert SHA-256 = $POST_SHA"
    - POST_PREFIX=$(printf '%s' "$POST_SHA" | cut -c1-8); echo "apk cert prefix = $POST_PREFIX"; if [ "$POST_PREFIX" != "e47e48d3" ]; then echo "!!! 构建后证书与红线 e47e48d3 不一致 !!!"; exit 1; fi
    - sha256sum xiaoyan-pet-v1.3.0-release.apk
    # 红线自查: release 包必须不含 debug 面板 (面板类在 debug 源码集, release 不编译进包; dex 级复核类名残留)
    - "unzip -p xiaoyan-pet-v1.3.0-release.apk classes*.dex 2>/dev/null | grep -a 'DebugPanel' && echo '!!! release 含 DebugPanel !!!' && exit 1 || echo 'debug 面板复核 OK (release 无 DebugPanel 类)'"
  artifacts:
    when: on_success
    paths:
      - xiaoyan-pet-v1.3.0-release.apk
    expire_in: 7 days

# ---------- debug 构建 (含 debug 面板, 仅供验收; 独立签名, 与 release 不能共存安装) ----------
build-debug:
  stage: build
  needs: ["probe"]
  script:
    - export JAVA_TOOL_OPTIONS="-Xmx1400m -XX:MaxMetaspaceSize=512m"
    - gradle --no-daemon -Dorg.gradle.jvmargs="-Xmx1400m -XX:MaxMetaspaceSize=512m" assembleDebug 2>&1 | tail -80
    - ls -la app/build/outputs/apk/debug/
    - cp app/build/outputs/apk/debug/app-debug.apk xiaoyan-pet-v1.3.0-debug.apk
    - ls -la xiaoyan-pet-v1.3.0-debug.apk
  artifacts:
    when: on_success
    paths:
      - xiaoyan-pet-v1.3.0-debug.apk
    expire_in: 14 days
