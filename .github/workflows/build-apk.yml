name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e
          echo "=== ANDROID_HOME is pre-set: $ANDROID_HOME ==="
          echo "=== Adding SDK tools to PATH ==="
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          fi
          if [ -d "$ANDROID_HOME/platform-tools" ]; then
            echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          fi
          # Accept licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          # Ensure platform and build-tools installed
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          echo "=== SDK ready ==="
          
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Gradle
        shell: bash
        run: |
          set -e
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH
          
      - name: Decode keystore
        if: ${{ secrets.env.KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          set -e
          echo "=== Decoding keystore ==="
          echo "${{ secrets.env.KEYSTORE_BASE64 }}" | base64 -d > app/keystore/release.keystore
          ls -la app/keystore/release.keystore
          echo "=== Verifying keystore ==="
          keytool -list -v -keystore app/keystore/release.keystore -storepass "${{ secrets.env.KEYSTORE_PASSWORD }}" 2>&1 | grep -E "Alias|Valid|Key Algorithm|Key Size" || true
          
      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          export PATH="/opt/gradle-8.7/bin:$PATH"
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build-debug.log
          
      - name: Build Release APK
        if: ${{ secrets.env.KEYSTORE_BASE64 != '' }}
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.env.KEY_PASSWORD }}
        run: |
          set -e
          export PATH="/opt/gradle-8.7/bin:$PATH"
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build-release.log
          
      - name: Verify Release APK signature
        if: ${{ secrets.env.KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          set -e
          APK="$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)"
          if [ -z "$APK" ]; then echo "❌ No release APK"; exit 1; fi
          echo "=== APK: $APK ($(stat -c%s $APK) bytes) ==="
          # Check v2/v3 signature scheme
          apksigner verify --print-certs --verbose "$APK" 2>&1 || true
          
      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiaoyan-pet-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            build-debug.log
          if-no-files-found: ignore

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiaoyan-pet-release
          path: |
            app/build/outputs/apk/release/*.apk
            build-release.log
          if-no-files-found: ignore
