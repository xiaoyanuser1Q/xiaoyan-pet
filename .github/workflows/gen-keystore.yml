name: Generate Keystore

on:
  workflow_dispatch:
    inputs:
      alias:
        description: "Key alias"
        default: "xiaoyan"
        required: false
      key_password:
        description: "Key password"
        default: "xiaoyan2026!"
        required: false
        type: string
      store_password:
        description: "Keystore password"
        default: "xiaoyan2026!"
        required: false
        type: string

jobs:
  gen:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate keystore
        shell: bash
        run: |
          set -e
          echo "=== Generating keystore ==="
          keytool -genkey -v \
            -keystore xiaoyan-release.keystore \
            -alias "${{ inputs.alias }}" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "${{ inputs.store_password }}" \
            -keypass "${{ inputs.key_password }}" \
            -dname "CN=Xiaoyan Pet, OU=Dev, O=Xiaoyan, L=Chongqing, ST=Chongqing, C=CN"
          
          echo "=== Keystore generated ==="
          ls -la xiaoyan-release.keystore
          
          echo "=== Keystore info ==="
          keytool -list -v -keystore xiaoyan-release.keystore -storepass "${{ inputs.store_password }}"
          
          echo "=== Base64 encoded ==="
          base64 -w 0 xiaoyan-release.keystore > xiaoyan-release.keystore.b64
          cat xiaoyan-release.keystore.b64 | head -c 200
          echo "..."
          wc -c xiaoyan-release.keystore.b64

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaoyan-release-keystore
          path: |
            xiaoyan-release.keystore
            xiaoyan-release.keystore.b64
          retention-days: 90
